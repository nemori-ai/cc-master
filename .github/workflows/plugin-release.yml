# Attested plugin package qualification.
#
# Draft boundary: this workflow uploads the exact transaction outputs as a workflow artifact.
# It intentionally has no tag trigger and no GitHub Release action. TX4 may promote these exact
# bytes only after wiring the trusted snapshot producer and approving the release attestation.
name: plugin-release-draft

on:
  workflow_dispatch:
    inputs:
      attestation_run_id:
        description: Run ID that produced the immutable trusted-release-input artifact
        required: true
        type: string
      attestation_artifact:
        description: Artifact containing release-input.json and its immutable snapshot roots
        required: true
        default: trusted-release-input
        type: string

permissions:
  actions: read
  contents: read

jobs:
  package-plugin:
    runs-on: ubuntu-latest
    steps:
      - name: Download attested immutable release inputs
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.attestation_artifact }}
          run-id: ${{ inputs.attestation_run_id }}
          github-token: ${{ github.token }}
          path: trusted-release-input

      - name: Resolve attested source commit
        id: input
        run: |
          MANIFEST="${GITHUB_WORKSPACE}/trusted-release-input/release-input.json"
          test -f "${MANIFEST}"
          COMMIT="$(node -e '
            const fs = require("node:fs");
            const input = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!/^[0-9a-f]{40}$/.test(input.commit || "")) process.exit(2);
            process.stdout.write(input.commit);
          ' "${MANIFEST}")"
          TAG="$(node -e '
            const fs = require("node:fs");
            const input = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (!/^[A-Za-z0-9._+-]+$/.test(input.tag || "")) process.exit(2);
            process.stdout.write(input.tag);
          ' "${MANIFEST}")"
          echo "manifest=${MANIFEST}" >> "${GITHUB_OUTPUT}"
          echo "commit=${COMMIT}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Checkout attested packaging code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.input.outputs.commit }}
          path: source

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and audit exact four-host release
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/dist"
          bash source/scripts/package-plugin.sh \
            --manifest "${{ steps.input.outputs.manifest }}" \
            --out-dir "${GITHUB_WORKSPACE}/dist" \
            > "${RUNNER_TEMP}/cc-master-plugin-upload-set.txt"
          RELEASE_DIR="${GITHUB_WORKSPACE}/dist/cc-master-plugin-${{ steps.input.outputs.tag }}"
          test -d "${RELEASE_DIR}"
          test "$(wc -l < "${RUNNER_TEMP}/cc-master-plugin-upload-set.txt")" -eq 6
          while IFS= read -r file; do
            test -f "${file}"
            case "${file}" in
              "${RELEASE_DIR}"/*) ;;
              *) echo "output escaped attested release directory: ${file}" >&2; exit 1 ;;
            esac
          done < "${RUNNER_TEMP}/cc-master-plugin-upload-set.txt"

      - name: Verify checksum manifest from the attested bytes
        working-directory: dist/cc-master-plugin-${{ steps.input.outputs.tag }}
        run: sha256sum --check SHA256SUMS

      - name: Upload exact attested release bytes
        uses: actions/upload-artifact@v4
        with:
          name: cc-master-plugin-${{ steps.input.outputs.tag }}
          path: dist/cc-master-plugin-${{ steps.input.outputs.tag }}/*
          if-no-files-found: error
          include-hidden-files: true
