# ccm-ci —— ccm 产品门 + plugin maintainer-contract 门。
# required status `build-and-check` 保持稳定，内部聚合 ccm 与 plugin-contracts 两条独立证据线。
name: ccm-ci

on:
  # pull_request 不限 paths：build-and-check 是 main 分支保护的 required status check，
  # 必须对每个 PR 都 report success——否则不碰 ccm/ 的 PR（skills / docs / hooks 改动）
  # 因这个 check 从不运行而永久 BLOCKED（required check 永不满足）。ccm 未变时
  # turbo/pnpm 缓存让 build/typecheck/lint/test 四步快速过，代价可接受。
  pull_request:
  # push 只保留 main 的落地验证：feature branch 已由 pull_request 覆盖，release tag
  # 指向的 commit 也已经过 PR/main 验证；不再为同一 SHA 重复分配 runner。
  push:
    branches:
      - 'main'
    paths:
      - 'ccm/**'
      - '.github/workflows/ccm-ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ccm:
    name: ccm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # pnpm 版本对齐 ccm/package.json 的 packageManager（pnpm@10.22.0）。
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      # setup-node 装的是 nodejs.org 官方 node；启用 pnpm store 缓存加速依赖安装。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ccm/pnpm-lock.yaml

      # 用 --frozen-lockfile 保证依赖与 lockfile 严格一致（不改 lock）。
      - name: Install deps
        working-directory: ccm
        run: pnpm install --frozen-lockfile

      # 以下四步与本地 `pnpm -C ccm run <x>` 一一对应；turbo 内部已处理任务依赖顺序。
      - name: Build
        run: pnpm -C ccm run build

      - name: Typecheck
        run: pnpm -C ccm run typecheck

      - name: Lint
        run: pnpm -C ccm run lint

      - name: Test
        run: pnpm -C ccm run test

  # plugin-contracts 跑 AGENTS.md §10 第一道门的**快层**：`bash run-tests.sh --fast` = 全部 hook /
  # script 测试 + 投影与矩阵 check + skill-lint + 除 tests/heavy-tests.txt 登记者外的全部 content
  # 测试。此前这里只精选 4 步，于是「文档声称的门」远宽于「机制执行的门」，真回归被漏过（issue #213）。
  # 重型层（tests/heavy-tests.txt）不在 PR 上跑——单文件动辄数分钟，由 nightly-heavy-tests.yml 覆盖。
  plugin-contracts:
    name: plugin-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ccm/pnpm-lock.yaml

      # run-tests.sh 会 `pnpm -C ccm build` 出 dev-bin shim，让 hook 测试真走 ccm 进程边界路径
      # （缺 pnpm 时它软失败退回 require path）。先装依赖以确保走的是真路径而非降级路径。
      - name: Install ccm deps
        working-directory: ccm
        run: pnpm install --frozen-lockfile

      - name: Fast gate (run-tests.sh --fast)
        run: bash run-tests.sh --fast

      # 保留：唯一一处对**真实 plugin/dist 树**扫描 repo-only knowledge 的断言。
      # trusted-release-bundle.test.mjs 只用合成输入测这个纯函数，不扫真树。
      - name: Final dist knowledge boundary
        run: node scripts/check-release-knowledge-boundary.mjs

  # Branch protection depends on this exact job id. Keep it as the stable aggregate instead of
  # renaming the required check every time an independent product/plugin gate is added.
  build-and-check:
    name: build-and-check
    if: ${{ always() }}
    needs: [ccm, plugin-contracts]
    runs-on: ubuntu-latest
    steps:
      - name: Require every component gate
        env:
          CCM_RESULT: ${{ needs.ccm.result }}
          PLUGIN_CONTRACTS_RESULT: ${{ needs.plugin-contracts.result }}
        run: |
          test "${CCM_RESULT}" = "success"
          test "${PLUGIN_CONTRACTS_RESULT}" = "success"
